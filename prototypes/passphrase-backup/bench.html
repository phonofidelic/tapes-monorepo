<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KDF Benchmark</title>
  </head>
  <body>
    <div class="banner">Throwaway prototype for TAP-218. Not Tapes.</div>
    <main>
      <nav>
        <a href="./index.html">Back up</a><a href="./restore.html">Restore</a
        ><a href="./bench.html">Benchmark</a>
      </nav>
      <h1>Key derivation benchmark</h1>
      <p class="muted">
        Runs each setting in a worker, like the real flow. The first run of each
        row includes loading WebAssembly. Keep the screen on and the page in
        front. Close other tabs.
      </p>
      <section>
        <label
          >Runs per setting
          <select id="runs">
            <option>3</option>
            <option selected>5</option>
            <option>10</option>
          </select></label
        >
        <button id="run">Run benchmark</button>
        <button class="secondary" id="copy" hidden>Copy results</button>
        <p id="status" class="muted"></p>
      </section>
      <section>
        <table>
          <thead>
            <tr>
              <th>Setting</th>
              <th>Median</th>
              <th>Min</th>
              <th>Max</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
      <p class="muted" id="ua"></p>
      <pre id="log"></pre>
    </main>
    <script type="module" src="./src/pages/bench.ts"></script>
  </body>
</html>
