<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
  role="img"
  aria-label="Tapes"
>
  <!--
    Source of truth for every generated PWA icon; see pwa-assets.config.ts and
    `yarn workspace web-client generate-pwa-assets`. A cassette mark drawn on a
    full-bleed square so the maskable variant survives a circular crop: all of
    the shape sits inside the centre 80% safe zone.

    Colours are the only two the app already commits to — zinc-900 (#18181b, the
    QR foreground in src/DownloadPrompt.tsx) on white.
  -->
  <rect width="512" height="512" fill="#ffffff" />
  <g fill="none" stroke="#18181b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cassette shell -->
    <rect x="76" y="136" width="360" height="240" rx="28" />
    <!-- Label panel -->
    <rect x="116" y="166" width="280" height="88" rx="14" />
    <!-- Reels, clear of the label above and the shell below -->
    <circle cx="186" cy="312" r="34" />
    <circle cx="326" cy="312" r="34" />
  </g>
  <g fill="#18181b">
    <!-- Reel hubs -->
    <circle cx="186" cy="312" r="11" />
    <circle cx="326" cy="312" r="11" />
  </g>
</svg>
